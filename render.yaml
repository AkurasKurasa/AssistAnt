# Render Blueprint for the public showcase (https://render.com/docs/blueprint-spec).
# Fake data for everyone. Ordinary visitors get the keyless models only; visitors who open the
# site with ?code=<DEMO_ACCESS_CODE> (for example, your professor) also get the providers whose
# keys you fill in below. Keys are kept in Render as secrets, never in this file or in git.
services:
  - type: web
    name: assistant-demo
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/connectors
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
      - key: WORKSPACE
        value: demo
      - key: CLAUDE_CODE_ENABLED
        value: "false"
      - key: NODE_VERSION
        value: "22"
      # The access code, generated by Render. Find it under Environment, then share ?code=<it>.
      - key: DEMO_ACCESS_CODE
        generateValue: true
      # Free provider keys: fill in any you have (Render asks for these when you create the
      # Blueprint; leave the rest empty). See docs/DEPLOY.md for where to get each one.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      # Optional: a FreeLLMAPI router you host somewhere always on (https://github.com/tashfeenahmed/freellmapi).
      - key: FREELLMAPI_URL
        sync: false
      - key: FREELLMAPI_KEY
        sync: false
